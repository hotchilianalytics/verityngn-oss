[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verityngn"
version = "3.0.0"
description = "Open-source multimodal video claim verification engine with Deep Research"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "HotChili Analytics, LLC" }]
keywords = ["fact-checking", "youtube", "verification", "osint", "multimodal", "deep-research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "python-dotenv>=1.0.0",
    "rapidfuzz>=3.0.0",
    "markdown-it-py[plugins]>=3.0.0",
    "pydantic>=2.7.4",
    "langchain>=0.3.17",
    "langchain-google-vertexai>=2.0.0",
    "langgraph>=0.2.50",
    "google-cloud-aiplatform>=1.81.0",
    "google-cloud-storage>=2.18.0",
    "yt-dlp>=2024.12.13",
    "requests>=2.31.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "youtube-transcript-api>=0.6.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
deep = ["google-genai>=1.0.0"]
vision = ["mediapipe==0.10.18", "opencv-python-headless>=4.8.0"]
audio = ["librosa>=0.10.0", "soundfile>=0.12.0", "numpy>=1.24.0"]
all = ["verityngn[deep,vision,audio]"]

[project.scripts]
verityngn = "verityngn.cli:main"

[project.urls]
Homepage = "https://github.com/hotchilianalytics/verityngn-oss"
Documentation = "https://hotchilianalyticsllc.mintlify.app"
Issues = "https://github.com/hotchilianalytics/verityngn-oss/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["verityngn*"]

[tool.setuptools.package-data]
verityngn = [
    "config/*.yaml",
    "config/*.json",
    "services/deepresearch/prompts/*.md",
]

[tool.pytest.ini_options]
testpaths = ["test", "tests"]
python_files = ["test_*.py"]
markers = [
    "live: tests that require network/cookies (deselect with '-m \"not live\"')",
]
